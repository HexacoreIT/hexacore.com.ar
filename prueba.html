<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Prueba de formulario</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #e6e8ee;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .wrap { width: min(100%, 480px); }
    h1 { font-size: 1.4rem; margin-bottom: 0.4rem; }
    .note { font-size: 0.9rem; color: #9aa3b2; margin-bottom: 1.5rem; }
    form { display: flex; flex-direction: column; gap: 0.9rem; }
    label { font-size: 0.85rem; color: #9aa3b2; }
    input, textarea {
      width: 100%;
      margin-top: 0.3rem;
      padding: 0.65rem 0.75rem;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      color: #e6e8ee;
      font: inherit;
    }
    textarea { min-height: 100px; resize: vertical; }
    button {
      padding: 0.75rem 1rem;
      background: #c32c2e;
      border: 0;
      border-radius: 8px;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { margin-top: 1rem; font-size: 0.9rem; line-height: 1.5; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Prueba de envío</h1>
    <p class="note">Página de prueba. No es parte del sitio. Endpoint: <code>/api/contacto</code></p>

    <form id="test-form" novalidate>
      <div>
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" autocomplete="name" required />
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
      </div>
      <div>
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" required></textarea>
      </div>
      <div id="turnstile-slot"></div>
      <button type="submit" id="submit">Enviar</button>
    </form>

    <div id="status" role="status"></div>
  </div>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
  <script>
    var SITEKEY = "0x4AAAAAAGI8JFUqi017tEF4";
    var widgetId = null;
    var script = document.currentScript.previousElementSibling;

    function renderWidget() {
      if (widgetId !== null || !window.turnstile) return;
      widgetId = turnstile.render("#turnstile-slot", {
        sitekey: SITEKEY,
        language: "es",
        theme: "dark"
      });
    }

    if (script) script.addEventListener("load", renderWidget);
    window.addEventListener("load", renderWidget);
    var readyTimer = setInterval(function () {
      if (window.turnstile) {
        renderWidget();
        clearInterval(readyTimer);
      }
    }, 200);

    document.getElementById("test-form").addEventListener("submit", function (event) {
      event.preventDefault();

      var status = document.getElementById("status");
      var button = document.getElementById("submit");
      var token = widgetId !== null && window.turnstile ? turnstile.getResponse(widgetId) : "";

      if (!token) {
        status.className = "err";
        status.textContent = "Falta el token de Turnstile.";
        return;
      }

      var started = performance.now();
      button.disabled = true;
      button.textContent = "Enviando...";
      status.className = "";
      status.textContent = "";

      fetch("/api/contacto", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nombre: document.getElementById("nombre").value,
          email: document.getElementById("email").value,
          mensaje: document.getElementById("mensaje").value,
          turnstileToken: token
        })
      })
        .then(function (res) {
          return res.text().then(function (text) {
            return { ok: res.ok, status: res.status, text: text };
          });
        })
        .then(function (result) {
          var ms = Math.round(performance.now() - started);
          status.className = result.ok ? "ok" : "err";
          status.textContent = (result.ok ? "Enviado" : "Error " + result.status) + " en " + ms + " ms. " + result.text;
          if (window.turnstile && widgetId !== null) turnstile.reset(widgetId);
        })
        .catch(function (error) {
          var ms = Math.round(performance.now() - started);
          status.className = "err";
          status.textContent = "Error de red en " + ms + " ms. " + error.message;
        })
        .finally(function () {
          button.disabled = false;
          button.textContent = "Enviar";
        });
    });
  </script>
</body>
</html>
