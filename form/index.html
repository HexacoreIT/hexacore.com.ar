<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto por WhatsApp | Hexacore</title>
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/svg+xml" href="./img/logo.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="demo-wrap">
    <a href="#" class="brand" aria-label="Hexacore">
      <img src="./img/logo.svg" alt="Hexacore Logo" class="brand__logo" width="72" height="72" />
    </a>

    <form class="contact-form quiz-form" id="contact-form" novalidate aria-label="Consulta en 3 pasos">
      <p class="quiz-progress" aria-live="polite"><span id="quiz-step-label">Paso 1 de 3</span></p>
      <ol class="quiz-dots" aria-hidden="true">
        <li class="is-current" data-step-dot="1"></li>
        <li data-step-dot="2"></li>
        <li data-step-dot="3"></li>
      </ol>

      <div class="form-step is-active" data-step="1">
        <h3 class="quiz-question">¿Qué necesitás?</h3>
        <div class="quiz-options" role="radiogroup" aria-label="Servicio">
          <label class="quiz-option"><input type="radio" name="servicio" value="Infraestructura" /><span>Infraestructura</span></label>
          <label class="quiz-option"><input type="radio" name="servicio" value="Seguridad" /><span>Seguridad</span></label>
          <label class="quiz-option"><input type="radio" name="servicio" value="Cloud" /><span>Cloud</span></label>
          <label class="quiz-option"><input type="radio" name="servicio" value="Soporte Técnico" /><span>Soporte Técnico</span></label>
          <label class="quiz-option"><input type="radio" name="servicio" value="Redes" /><span>Redes</span></label>
          <label class="quiz-option"><input type="radio" name="servicio" value="Bases de Datos" /><span>Bases de Datos</span></label>
        </div>
      </div>

      <div class="form-step" data-step="2" hidden>
        <h3 class="quiz-question">¿De cuántos equipos hablamos?</h3>
        <div class="quiz-options" role="radiogroup" aria-label="Tamaño">
          <label class="quiz-option"><input type="radio" name="tamano" value="1 a 10" /><span>1 a 10</span></label>
          <label class="quiz-option"><input type="radio" name="tamano" value="11 a 50" /><span>11 a 50</span></label>
          <label class="quiz-option"><input type="radio" name="tamano" value="Más de 50" /><span>Más de 50</span></label>
        </div>
        <button class="quiz-back" type="button" data-back>Atrás</button>
      </div>

      <div class="form-step" data-step="3" hidden>
        <h3 class="quiz-question">¿Cómo te contactamos?</h3>
        <div class="form-field">
          <label for="f-tel">WhatsApp</label>
          <input id="f-tel" name="telefono" type="tel" autocomplete="tel" inputmode="tel" placeholder="11 2345-6789" />
        </div>
        <div class="form-field">
          <label for="f-email">Email</label>
          <input id="f-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="tu@empresa.com" />
        </div>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <button class="button button--primary button--full" type="submit" id="form-submit">Enviar por WhatsApp</button>
        <button class="quiz-back" type="button" data-back>Atrás</button>
      </div>

      <div class="form-step" data-step="4" hidden>
        <div class="quiz-success">
          <span class="quiz-success__icon" aria-hidden="true">✓</span>
          <h3 class="quiz-question">¡Listo!</h3>
          <p>Se abrió tu WhatsApp con el mensaje armado.<br />Apretalo enviar y nos llega directo.</p>
        </div>
      </div>
    </form>
  </main>

  <script>
    (function () {
      var form = document.getElementById('contact-form');
      var steps = Array.prototype.slice.call(form.querySelectorAll('.form-step'));
      var dots = Array.prototype.slice.call(form.querySelectorAll('[data-step-dot]'));
      var stepLabel = document.getElementById('quiz-step-label');
      var errEl = document.getElementById('form-error');
      var submitBtn = document.getElementById('form-submit');
      let current = 1;

      const val = (id) => document.getElementById(id).value.trim();
      const choice = (name) => {
        const checked = form.querySelector('input[name="' + name + '"]:checked');
        return checked ? checked.value : '';
      };

      function showError(msg) {
        if (!errEl) return;
        if (msg) {
          errEl.textContent = msg;
          errEl.hidden = false;
        } else {
          errEl.hidden = true;
        }
      }

      function goTo(step) {
        current = Math.min(Math.max(step, 1), 4);
        steps.forEach((panel) => {
          const active = Number(panel.dataset.step) === current;
          panel.classList.toggle('is-active', active);
          panel.hidden = !active;
        });
        document.querySelectorAll('[data-step-dot]').forEach((dot) => {
          const n = Number(dot.dataset.stepDot);
          dot.classList.toggle('is-current', n === current);
          dot.classList.toggle('is-done', n < current);
        });
        if (stepLabel) stepLabel.textContent = current > 3 ? '¡Listo!' : 'Paso ' + current + ' de 3';
        showError('');
      }

      // Avance automático al elegir opción (click, no change)
      document.querySelectorAll('.quiz-options input[type="radio"]').forEach((radio) => {
        radio.addEventListener('click', () => {
          const panel = radio.closest('.form-step');
          const step = Number(panel.dataset.step);
          setTimeout(() => goTo(step + 1), 220);
        });
      });

      document.querySelectorAll('[data-back]').forEach((btn) => {
        btn.addEventListener('click', () => goTo(current - 1));
      });

      document.getElementById('contact-form').addEventListener('submit', (event) => {
        event.preventDefault();

        const tel = document.getElementById('f-tel').value.trim();
        const email = document.getElementById('f-email').value.trim();
        if (!val('f-tel') && !val('f-email')) {
          showError('Completá tu WhatsApp o tu email para que te contactemos.');
          return;
        }
        if (val('f-email') && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val('f-email'))) {
          showError('Ese email no parece válido.');
          return;
        }
        showError('');

        const svc = choice('servicio') || 'General';
        const tam = choice('tamano') || '-';
        const full = 'Servicio: ' + choice('servicio') + '\nTamaño: ' + choice('tamano') + ' equipos' +
          (val('f-tel') ? '\nWhatsApp: ' + val('f-tel') : '') +
          (val('f-email') ? '\nEmail: ' + val('f-email') : '');

        const waBtn = document.getElementById('send-whatsapp');
        const emailBtn = document.getElementById('send-email');
        if (waBtn) {
          waBtn.href = 'https://api.whatsapp.com/send?phone=5491123923138&text=' + encodeURIComponent('Hola Hexacore\n\n' + full);
        }
        if (emailBtn) {
          emailBtn.href = 'mailto:soporte@hexacore.com.ar?subject=' + encodeURIComponent('Consulta web — ' + val('f-nombre')) + '&body=' + encodeURIComponent(full);
        }

        // Simular envío exitoso - ir directo a pantalla de éxito
        goTo(4);
      });

      function goTo(step) {
        current = Math.min(Math.max(step, 1), 4);
        document.querySelectorAll('.form-step').forEach((panel) => {
          const active = Number(panel.dataset.step) === current;
          panel.classList.toggle('is-active', active);
          panel.hidden = !active;
        });
        document.querySelectorAll('[data-step-dot]').forEach((dot) => {
          const n = Number(dot.dataset.stepDot);
          dot.classList.toggle('is-current', n === current);
          dot.classList.toggle('is-done', n < current);
        });
        if (document.getElementById('quiz-step-label')) {
          stepLabel.textContent = current > 3 ? '¡Listo!' : 'Paso ' + current + ' de 3';
        }
        showError('');
      }

      function showError(msg) {
        if (!errEl) return;
        if (msg) {
          errEl.textContent = msg;
          errEl.hidden = false;
        } else {
          errEl.hidden = true;
        }
      }

      function choice(name) {
        const checked = document.querySelector('input[name="' + name + '"]:checked');
        return checked ? checked.value : '';
      }

      function val(id) {
        return document.getElementById(id).value.trim();
      }

      document.querySelectorAll('.quiz-options input[type="radio"]').forEach((radio) => {
        radio.addEventListener('click', () => {
          const panel = radio.closest('.form-step');
          const step = Number(panel.dataset.step);
          setTimeout(() => goTo(step + 1), 220);
        });
      });

      document.querySelectorAll('[data-back]').forEach((btn) => {
        btn.addEventListener('click', () => goTo(current - 1));
      });

      document.getElementById('contact-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const tel = document.getElementById('f-tel').value.trim();
        const email = document.getElementById('f-email').value.trim();
        if (!document.getElementById('f-tel').value.trim() && !document.getElementById('f-email').value.trim()) {
          showError('Completá tu WhatsApp o tu email para que te contactemos.');
          return;
        }
        if (val('f-email') && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val('f-email'))) {
          showError('Ese email no parece válido.');
          return;
        }
        showError('');

        const svc = choice('servicio') || 'General';
        const tam = choice('tamano') || '-';
        const full = 'Servicio: ' + choice('servicio') + '\nTamaño: ' + choice('tamano') + ' equipos' +
          (val('f-tel') ? '\nWhatsApp: ' + val('f-tel') : '') +
          (val('f-email') ? '\nEmail: ' + val('f-email') : '');

        const waBtn = document.getElementById('send-whatsapp');
        const emailBtn = document.getElementById('send-email');
        if (waBtn) {
          waBtn.href = 'https://api.whatsapp.com/send?phone=5491123923138&text=' + encodeURIComponent('Hola Hexacore\n\n' + 'Servicio: ' + choice('servicio') + '\nTamaño: ' + choice('tamano') + ' equipos' + (val('f-tel') ? '\nWhatsApp: ' + val('f-tel') : '') + (val('f-email') ? '\nEmail: ' + val('f-email') : ''));
        }
        if (emailBtn) {
          emailBtn.href = 'mailto:soporte@hexacore.com.ar?subject=' + encodeURIComponent('Consulta web — ' + val('f-nombre') || '') + '&body=' + encodeURIComponent(full);
        }

        // Go to success screen
        goTo(4);
      });

      goTo(1);
    })();
  </script>
</body>
</html>
